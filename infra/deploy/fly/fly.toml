# infra/deploy/fly/fly.toml
# Fly.io configuration for the BSLT API + Background Worker service (`infra/docker/Dockerfile`).
# Usage from repository root:
#   fly launch --config infra/deploy/fly/fly.toml --no-deploy
#   fly secrets set DATABASE_URL=... MIGRATION_DATABASE_URL=... WORKER_DATABASE_URL=... \
#     LISTEN_DATABASE_URL=... JWT_SECRET=... COOKIE_SECRET=... OAUTH_TOKEN_ENCRYPTION_KEY=...
#   fly deploy --config infra/deploy/fly/fly.toml

app = "bslt-api"
primary_region = "iad"

[build]
  dockerfile = "../../docker/Dockerfile"

[deploy]
  release_command = "node node_modules/@bslt/db/dist/migrate/entry.js"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  PROCESS_ROLE = "all"
  TRUST_PROXY = "true"
  AUTH_STRATEGIES = "local,magic"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
