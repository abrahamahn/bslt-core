# infra/deploy/render/render.yaml
# Render Blueprint for BSLT (PostgreSQL 17 + API/Worker + Web SSR/SPA).
# Connect your repository in Render Dashboard -> Blueprints -> New Blueprint Instance.

databases:
  - name: bslt-postgres
    plan: basic-256mb
    postgresMajorVersion: '17'
    databaseName: bslt
    user: bslt_owner

services:
  - type: web
    name: bslt-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    preDeployCommand: node node_modules/@bslt/db/dist/migrate/entry.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '8080'
      - key: PROCESS_ROLE
        value: all
      - key: TRUST_PROXY
        value: 'true'
      - key: AUTH_STRATEGIES
        value: local,magic
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bslt-postgres
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: bslt-postgres
          property: connectionString
      - key: WORKER_DATABASE_URL
        fromDatabase:
          name: bslt-postgres
          property: connectionString
      - key: LISTEN_DATABASE_URL
        fromDatabase:
          name: bslt-postgres
          property: connectionString
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false

  - type: web
    name: bslt-web
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.web
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROCESS_ROLE
        value: web
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '8080'
      - key: WEB_CLIENT_DIR
        value: /app/dist/client
      - key: API_UPSTREAM_URL
        sync: false
