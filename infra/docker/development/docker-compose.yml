# infra/docker/development/docker-compose.yml
# Full local stack (database + API image + web) for the starter app.
#
# Usage:
#   docker compose --env-file config/env/.env.development -f infra/docker/development/docker-compose.yml up -d --build
#
# The API needs config/env/.env.development (`pnpm bootstrap` writes it). The
# file is gitignored, so it is optional here: `docker compose config` has to
# validate on a fresh clone. Requires Docker Compose 2.24 or newer.
#
# This stack runs on the single POSTGRES_* role, in development mode. The
# database role split (docs/deploy/env.md#database-roles) is exercised by
# infra/docker/production/docker-compose.prod.yml.

name: starter

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: abe-postgres
    env_file:
      - path: ../../../config/env/.env.development
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abe_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../../..
      dockerfile: infra/docker/Dockerfile
    container_name: abe-api
    env_file:
      - path: ../../../config/env/.env.development
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      API_PORT: 8080
      POSTGRES_HOST: postgres
      # The same three values postgres above is created with, so the two
      # services agree whether or not --env-file is passed.
      POSTGRES_DB: ${POSTGRES_DB:-abe_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development}
      # Development mode: this stack has one database role. In production mode
      # the server refuses to start on it (docs/deploy/env.md#database-roles).
      NODE_ENV: development
      PNPM_WORKSPACE_ROOT: /app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    image: node:24.22.3-alpine
    working_dir: /app
    container_name: abe-web
    env_file:
      - path: ../../../config/env/.env.development
        required: false
    environment:
      APP_PORT: 4173
      API_PORT: 8080
      VITE_HOST: 0.0.0.0
      CI: 'true'
      PNPM_WORKSPACE_ROOT: /app
    volumes:
      - ../../../:/app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm --filter @bslt/web build &&
             pnpm --filter @bslt/web start --host 0.0.0.0 --port 4173"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '4173:4173'
    restart: unless-stopped

volumes:
  postgres_data:
