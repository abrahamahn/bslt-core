# infra/docker/development/docker-compose.dev.yml
# Development Docker Compose for the starter app
#
# Usage:
#   docker compose --env-file config/env/.env.local -f infra/docker/development/docker-compose.dev.yml up -d
#
# This compose file provides infrastructure services (PostgreSQL) for local development.
# Run the web and server apps directly with `pnpm dev` for hot reload.
#
# Full stack development workflow:
#   1. Start database: docker compose --env-file config/env/.env.local -f infra/docker/development/docker-compose.dev.yml up -d
#   2. Run migrations: pnpm db:migrate
#   3. Start dev servers: pnpm dev
#
# RESOURCE_PREFIX namespaces the project, container and volume (same knob as the
# prod compose). Two forks of this starter on one machine MUST set different
# prefixes in config/env/.env.local — with the same prefix they share one
# container and one data volume, and whichever fork starts first initializes the
# database, so the other fork's POSTGRES_DB is silently never created. Give each
# fork its own POSTGRES_PORT too, or the port binding collides when both run.

name: ${RESOURCE_PREFIX:-abe}-dev

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:17.11-alpine
    container_name: ${RESOURCE_PREFIX:-abe}-dev-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abe_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-abe_dev}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Redis (Optional - for cache/sessions/queues)
  # ===========================================================================
  # Uncomment if your development requires Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: ${RESOURCE_PREFIX:-abe}-dev-redis
  #   ports:
  #     - '${REDIS_PORT:-6379}:6379'
  #   volumes:
  #     - redis_dev_data:/data
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

volumes:
  postgres_dev_data:
    name: ${RESOURCE_PREFIX:-abe}-postgres-dev-data
  # redis_dev_data:
  #   name: ${RESOURCE_PREFIX:-abe}-redis-dev-data
